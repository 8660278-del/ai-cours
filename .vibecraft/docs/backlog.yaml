  - id: task-0313
    title: Раздел информационной безопасности и тренажёр ситуаций
    description: >-
      Создать отдельный раздел по информационной безопасности, доступный из
      меню, и связать его с заданиями модулей.

      Содержание: четыре уровня данных — открытые (опубликованные материалы,
      открытые прайсы, пресс-релизы), внутренние (инструкции, рабочие материалы,
      обезличенные заметки, шаблоны процессов), конфиденциальные (договоры,
      коммерческие условия, неопубликованные финансовые отчёты, тендерная
      информация), данные ограниченного доступа (персональные данные, пароли,
      платёжные реквизиты, ключи доступа) — с правилами использования для
      каждого уровня и оговоркой, что окончательные правила соответствуют
      политике информационной безопасности компании.

      Протокол безопасной работы из семи шагов: определить категорию данных,
      проверить, разрешён ли сервис, удалить ненужные сведения, обезличить при
      допустимости, передавать только необходимый фрагмент, проверить результат,
      восстановить нужные значения локально при допустимости. Отдельно
      объяснить, что обезличивание не всегда гарантирует невозможность
      идентификации.

      Тренажёр минимум из шести ситуаций: загрузка договора клиента в публичный
      чат-бот; передача таблицы с ФИО и зарплатами; обработка открытого текста с
      сайта; обезличенные внутренние инструкции в разрешённом сервисе; передача
      паролей и ключей доступа; черновик письма на основе открытых данных.
      Пользователь выбирает «разрешено», «разрешено при соблюдении условий» или
      «запрещено» и после ответа видит объяснение. Результат тренажёра
      сохраняется и виден на странице «Мой прогресс».
    status: pending
    acceptance_criteria:

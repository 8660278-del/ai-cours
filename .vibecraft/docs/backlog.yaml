version: 1
tasks:
  - id: task-7463
    title: Главная страница курса в фирменном стиле ГК ПИР
    description: >-
      Создать главную страницу учебного приложения со статическими
      данными-заглушками.

      Цель: дать пользователю первый визуальный результат как можно быстрее.

      На странице: шапка в фирменном стиле ГК ПИР (чёрный и оранжевый) с
      текстовым знаком «ГК ПИР» и меню, название курса «Нейросети для работы:
      как ускорить рутину и повысить продуктивность», краткое описание,
      приветствие пользователя, индикатор общего прогресса в процентах, список
      пяти модулей с продолжительностью и статусами (не начат / в процессе /
      завершён), блок текущей учебной задачи и крупная кнопка продолжения
      обучения. Ниже — короткие блоки-ссылки на библиотеку промптов, полезные
      материалы и мой прогресс.

      Оформить в деловом минималистичном стиле: светлый фон, строгая сетка,
      тонкие разделители, чёрный текст, оранжевый акцент только для главного
      действия, активного пункта меню и заполненной части индикатора прогресса.
      Адаптивно: на смартфоне одна колонка и компактная шапка.

      Реализовать только то, что пользователь увидит сразу при открытии
      приложения. Остальные страницы приложения в этой задаче не реализовывать.
    status: completed
    acceptance_criteria:
      - Главная страница открывается без ошибок и корректно выглядит на
        компьютере и на смартфоне
      - В шапке виден текстовый знак «ГК ПИР» и пункты меню курса
      - На странице видны название курса, приветствие, общий прогресс в
        процентах и все пять модулей со статусами и продолжительностью
      - Есть блок текущей учебной задачи и заметная кнопка продолжения обучения
      - Данные отображаются из статических заглушек
      - "Оранжевый цвет используется точечно: главное действие, активный пункт
        меню, прогресс"
    summary:
      "Реализована главная страница курса в фирменном стиле ГК ПИР: чёрная
      шапка с текстовым знаком и меню, приветствие, название и описание курса,
      общий прогресс 42%, блок текущей задачи с кнопкой продолжения, пять
      модулей со статусами и продолжительностью, а также ссылки на библиотеку
      промптов, полезные материалы и прогресс. Данные вынесены в статические
      заглушки lib/data.ts, адаптивная шапка — components/site-header.tsx,
      страница — app/page.tsx."
  - id: task-2414
    title: Программа курса, страницы уроков и сохранение прогресса
    description: >-
      Сделать каркас обучения, на который дальше накладывается весь учебный
      материал.

      Нужно: страница «Программа курса» со всеми пятью модулями — названия,
      продолжительность (2,5 ч; 3 ч; 3,5 ч; 2,5 ч; 2,5 ч), цель модуля и
      перечень уроков; последовательное открытие модулей (первый доступен сразу,
      следующий открывается после завершения предыдущего), закрытый модуль
      объясняет причину и предлагает перейти к предыдущему; завершённые модули
      остаются доступными для повторного прохождения.

      Внутри модуля одинаковая структура: введение, цель и ожидаемые результаты,
      содержание, уроки, резюме и памятка с ключевыми выводами.

      Каждый урок открывается отдельно: последовательная лента учебных блоков,
      переход к следующему и предыдущему уроку, оглавление модуля на больших
      экранах. Открытие урока не завершает его: урок отмечается пройденным
      только после выполнения предусмотренного задания или подтверждения
      прохождения блока.

      Страница «Мой прогресс»: общий процент прохождения, завершённые модули,
      пройденные уроки, выполненные задания.

      Прогресс сохраняется на сервере и восстанавливается после перезагрузки и
      на другом устройстве; сохранение подтверждается пользователю, при ошибке
      показывается понятное сообщение и возможность повторить действие, во время
      загрузки — состояния загрузки вместо пустых экранов.
    status: completed
    acceptance_criteria:
      - На странице программы видны все пять модулей с названиями,
        продолжительностью и перечнем уроков
      - Второй модуль открывается только после завершения первого, и так далее;
        закрытый модуль объясняет, что нужно завершить предыдущий
      - Завершённые модули остаются открытыми для повторного прохождения
      - Урок открывается отдельно, есть переходы к следующему и предыдущему уроку
      - Открытие урока без выполнения задания не отмечает его завершённым
      - После завершения урока общий прогресс на главной и на странице «Мой
        прогресс» обновляется
      - После перезагрузки страницы прогресс остаётся на месте
      - При ошибке сохранения пользователь видит понятное сообщение и может
        повторить действие
    summary: "Реализован каркас обучения: страница программы с пятью модулями и
      последовательным открытием, страницы модулей и отдельных уроков с блоками,
      переходами и оглавлением, страница «Мой прогресс». Прогресс сохраняется в
      DynamoDB через API /api/progress, загружается на сервере, подтверждается
      тостом и поддерживает повтор при ошибке; добавлены скелетоны загрузки.
      Основная реализация: lib/course-data.ts, lib/progress.ts, app/course/,
      app/progress/page.tsx, app/api/progress/route.ts."
  - id: task-3609
    title: "Модуль 1: основы ИИ, выбор инструмента и промпты"
    description: >-
      Наполнить первый модуль «Основы ИИ, выбор инструмента и эффективные
      промпты» (2,5 ч) полноценным учебным материалом и интерактивом.

      Урок 1.1 «Что такое генеративный ИИ и как он работает»: что такое ИИ,
      генеративный ИИ и большие языковые модели, как нейросеть формирует ответ,
      почему ИИ ошибается и почему убедительный ответ не всегда верный, отличие
      от поисковика, ИИ как помощник, а не замена экспертизы; возможности и
      ограничения (фактические ошибки, вымышленные источники, ошибки в расчётах,
      недостаток актуальных данных, зависимость от исходных данных, отсутствие
      ответственности). Интерактив: пять ответов нейросети — достоверный,
      частично правильный, с вымышленным фактом, с ошибочным расчётом, не
      соответствующий задаче; пользователь определяет, какие требуют проверки, и
      получает объяснение.

      Урок 1.2 «Какие задачи можно решать с помощью ИИ»: типовые офисные задачи
      по группам (текст, информация, данные, идеи, визуальные материалы) и
      матрица из трёх категорий риска — низкий риск, повышенный риск,
      недопустимые действия. Практическое задание: распределить 10 рабочих
      ситуаций по трём категориям с показом правильной классификации и
      объяснений.

      Урок 1.3 «Выбор подходящего ИИ-инструмента»: семь категорий инструментов
      (универсальные текстовые ассистенты, поиск информации, документы и файлы,
      таблицы и данные, изображения, презентации, транскрибация встреч) с
      задачами, сильными сторонами, ограничениями и тем, что проверять перед
      использованием; названия сервисов — примеры, а не обязательные.
      Интерактив: выбрать тип инструмента для 8 рабочих задач с объяснением.

      Урок 1.4 «Как правильно формулировать промпты»: шестикомпонентная формула
      (роль, задача, контекст, ограничения, формат, критерии качества), разбор
      слабого и улучшенного промпта для письма клиенту. Интерактив: конструктор
      промпта из шести полей, который собирает готовый текст и позволяет его
      скопировать; практическое задание — улучшить пять слабых промптов.

      Урок 1.5 «Диалог с нейросетью и улучшение результата»: итерационный подход
      из семи шагов; практическое задание — по некачественному результату
      сформулировать два уточняющих запроса.

      Для каждого урока — развёрнутый текст, примеры из офисной работы разных
      направлений, визуально различающиеся блоки (текст, карточка, «Было /
      Стало», «Правильно / Неправильно», шаблон), практическое задание с
      условием, исходными данными, инструкцией, ожидаемым результатом и
      критериями проверки. Завершить модуль резюме и памяткой с ключевыми
      выводами. Без видео.
    status: completed
    acceptance_criteria:
      - Все пять уроков модуля открываются и содержат развёрнутый учебный текст,
        а не набор заголовков
      - В уроке 1.1 работает задание с пятью ответами нейросети и объяснением
        после выбора
      - В уроке 1.2 задание с 10 ситуациями классифицируется по трём категориям
        с объяснениями
      - В уроке 1.3 интерактив по выбору типа инструмента для 8 задач
        сопровождается объяснением
      - Конструктор промпта в уроке 1.4 собирает текст из шести полей и
        позволяет его скопировать
      - Блоки «Было / Стало» и «Правильно / Неправильно» визуально отличаются от
        обычного текста
      - Каждое практическое задание содержит условие, исходные данные,
        инструкцию, ожидаемый результат и критерии проверки
      - После выполнения задания урок отмечается завершённым, модуль завершается
        резюме и памяткой
      - В модуле нет видео и обязательных ссылок на видео
    summary: "Наполнен модуль 1: пять уроков с развёрнутым текстом, примерами,
      блоками «Было / Стало», «Правильно / Неправильно», шаблонами и заданиями с
      условием, данными, инструкцией, результатом и критериями. Работают
      интерактивы: 5 ответов ИИ, 10 ситуаций по риску, выбор инструмента для 8
      задач, конструктор промпта из 6 полей с копированием и два уточнения.
      Реализация: lib/module1-content.ts, lib/module1-interactive-data.ts,
      components/lesson-interactive.tsx, components/lesson-blocks.tsx."
  - id: task-9217
    title: "Модуль 2: документы и деловая переписка (уроки 2.1–2.2)"
    description: >-
      Наполнить начало второго модуля «Документы, регламенты и деловые
      коммуникации» (3 ч).


      Сначала дать введение модуля, цель и ожидаемые результаты, содержание и
      список уроков.


      Урок 2.1 «Деловая переписка»: письма, ответы на обращения, напоминания,
      уведомления, запросы информации, корректировка тона, сокращение писем,
      варианты ответа; как передавать контекст переписки и не допускать
      неподтверждённых обещаний. Задание: по исходной ситуации подготовить
      письмо клиенту, ответ на претензию, напоминание коллеге и краткое письмо
      руководителю с проверкой тона и фактической точности.


      Урок 2.2 «Создание и редактирование документов»: служебные записки,
      инструкции, регламенты, должностные инструкции, памятки, FAQ, отчёты,
      коммерческие предложения; улучшение структуры, сокращение, смена стиля,
      адаптация под аудиторию; правило «ИИ формирует проект документа,
      согласование и проверка остаются за специалистом». Задание: из
      неструктурированного текста собрать служебную записку, пошаговую
      инструкцию и краткое резюме для руководителя.


      Каждый урок — развёрнутый текст, примеры из разных функций (HR, продажи,
      закупки, финансы, администрирование), визуально различающиеся блоки,
      практическое задание с условием, исходными данными, инструкцией, ожидаемым
      результатом, критериями проверки и эталоном для самопроверки. В заданиях —
      вопросы о допустимости передачи данных. Без видео.
    status: completed
    acceptance_criteria:
      - Уроки 2.1 и 2.2 открываются и содержат развёрнутый учебный текст с
        примерами
      - Задание урока 2.1 позволяет подготовить четыре варианта письма и
        проверить тон и точность
      - Задание урока 2.2 превращает неструктурированный текст в служебную
        записку, инструкцию и краткое резюме
      - В практических заданиях есть исходные данные, инструкция, ожидаемый
        результат, критерии проверки и эталон для самопроверки
      - В заданиях встречаются вопросы о допустимости передачи данных ИИ
    summary:
      "Наполнены уроки 2.1 и 2.2: развёрнутый текст, примеры из HR, продаж,
      закупок, финансов и администрирования, блоки «Было/Стало»,
      «Правильно/Неправильно», шаблоны и чек-листы. Добавлены интерактивные
      задания: четыре письма с самопроверкой тона и точности и преобразование
      неструктурированной заметки в служебную записку, инструкцию и резюме; в
      обоих есть вопрос о допустимости передачи данных и эталоны. Реализация:
      lib/module2-content.ts, lib/module2-interactive-data.ts,
      components/lesson2-interactive.tsx, подключение — lib/course-data.ts."
  - id: task-4821
    title: "Модуль 2: протоколы, документы и проверка (уроки 2.3–2.5)"
    description: >-
      Продолжить модуль 2 «Документы, регламенты и деловые коммуникации» и
      завершить его.


      Урок 2.3 «Протоколы встреч и рабочие договорённости»: извлечение вопросов,
      решений, задач, ответственных, сроков, открытых вопросов и рисков;
      различие между принятым решением и неутверждённым предложением. Задание:
      собрать протокол в формате таблицы «Вопрос — Решение — Задача —
      Ответственный — Срок» и найти два заранее заложенных смысловых искажения.


      Урок 2.4 «Работа с Word, PDF и несколькими документами»: извлечение
      информации, поиск ключевых условий, резюме, сравнение версий, поиск
      противоречий, обязательства и сроки, сводная таблица; обязательные
      требования — указывать исходные материалы, требовать ссылки на разделы, не
      выдумывать отсутствующие условия, отмечать неопределимое. Задание:
      сравнить два учебных документа, найти изменения, собрать таблицу отличий и
      выделить изменения, требующие внимания ответственного сотрудника.


      Урок 2.5 «Проверка и улучшение готовых документов»: проверка полноты,
      логики, соответствия исходным данным, дат и сумм, противоречий, делового
      стиля, обязательных элементов. Задание: найти в документе пропущенный
      срок, противоречие между пунктами, неподтверждённое обязательство и
      неясную формулировку, затем исправить документ.


      Каждый урок — развёрнутый текст, примеры из разных функций (HR, продажи,
      закупки, финансы, администрирование), визуально различающиеся блоки,
      практическое задание с условием, исходными данными, инструкцией, ожидаемым
      результатом, критериями проверки и эталоном для самопроверки. В заданиях —
      вопросы о допустимости передачи данных. Завершить модуль резюме и
      памяткой.
    status: completed
    acceptance_criteria:
      - Уроки 2.3, 2.4 и 2.5 открываются и содержат развёрнутый учебный текст с
        примерами
      - Задание урока 2.3 формирует протокол в формате таблицы и требует найти
        два смысловых искажения
      - Задание урока 2.4 даёт таблицу отличий двух документов и отмечает
        изменения, требующие внимания
      - Задание урока 2.5 требует найти четыре типа ошибок в документе и
        исправить его
      - В практических заданиях есть исходные данные, инструкция, ожидаемый
        результат, критерии проверки и эталон для самопроверки
      - В заданиях встречаются вопросы о допустимости передачи данных ИИ
      - "Модуль 2 полностью завершён: есть резюме и памятка с ключевыми выводами"
    summary: "Завершён модуль 2: добавлены уроки 2.3–2.5 с развёрнутым текстом,
      примерами из HR, продаж, закупок, финансов и администрирования, блоками
      «Было/Стало» и «Правильно/Неправильно». Интерактивы: поиск двух искажений
      в протоколе, таблица отличий двух редакций и проверка документа с четырьмя
      типами ошибок; во всех заданиях есть исходные данные, инструкция,
      ожидаемый результат, критерии, эталон и вопрос о данных. Модуль завершён
      резюме и памяткой; основная реализация — lib/module2-content.ts,
      lib/module2-interactive-data.ts, components/lesson2-advanced-interactive.tsx."
  - id: task-5022
    title: "Модуль 3: анализ текстов и данных (уроки 3.1–3.3)"
    description: >-
      Наполнить начало третьего модуля «Анализ информации, таблиц и проверка
      фактов» (3,5 ч).


      Сначала дать введение модуля, цель и ожидаемые результаты, содержание и
      список уроков.



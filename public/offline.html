<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нет подключения — ГК ПИР</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6f5f2;
        color: #1a1a1a;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 32px;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        margin-bottom: 16px;
        border-radius: 50%;
        background: #0c0c0d;
        color: #f36f21;
        font-size: 24px;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      p {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.5;
        color: #555555;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 12px 24px;
        background: #f36f21;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #d95f16;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true">ПИР</div>
      <h1>Нет подключения к интернету</h1>
      <p>
        Проверьте соединение и попробуйте снова. Уже открытые материалы курса
        останутся доступны.
      </p>
      <button type="button" onclick="window.location.reload()">
        Повторить попытку
      </button>
    </main>
  </body>
</html>
